<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Brothers Communication – Shop Closing</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)]">
<div class="max-w-6xl mx-auto p-3 sm:p-6 space-y-4">
  <header class="flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="h-11 w-11 rounded-xl bg-red-600 text-white flex items-center justify-center"><i data-lucide="store"></i></div>
      <div><h1 class="text-lg font-bold leading-tight">Brothers <span class="text-red-600">Communication</span></h1><p class="text-xs text-slate-500">Shop closing &amp; reporting system</p></div>
    </div>
    <nav id="tabs" class="flex gap-1 p-1 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 overflow-x-auto max-w-full"></nav>
    <div id="userbar" class="flex items-center gap-1"></div>
  </header>
  <div id="notice"></div>
  <div id="main" class="space-y-4"></div>
</div>
<script>
const NAD = 'NADRA / E-Sahulat';
const CATS = {
 'Printing & Photocopy':['Photocopy','B&W Printing','Color Printing','Document Printing','Binding','Lamination','Scanning'],
 'Photography':['Passport / ID Photos','Online Application Photos','Photo Editing','Photo Printing','Photo Resizing & Compression'],
 'Online Services':['Online Applications','Government Applications','College / University Applications','Job Applications','Online Registrations','Fee / Challan Services'],
 'Document Services':['Typing','Form Filling','PDF Creation','PDF Editing','PDF Compression','Document Formatting','File Conversion','OCR'],
 [NAD]:['NADRA Services','E-Sahulat Services','Biometrics','NADRA Fee Payment'],
 'E-Stamp & Legal':['E-Stamp Drafting / Printing','Affidavits','Agreements','Undertakings','NOCs','Other Legal Formats'],
 'Certificates & Govt Docs':['Domicile','Police Clearance','Other Govt Certificates'],
 'Payments':['Utility Bills','Government Fees','NADRA Fees','Online / Application Payments','Easypaisa / JazzCash Handling']
};
const INC_CATS = Object.keys(CATS).filter(c => c !== NAD);
const EXP = ['Rent','Electricity','Internet','Paper & Stationery','Toner / Ink','Salaries / Wages','Maintenance & Repair','Tea & Food','Transport','Equipment','Phone / Load','Other'];
const PEOPLE = ['Owner','Partner','Brother','Employee','Other'];
const TABS = [['dash','Dashboard','layout-dashboard'],['income','Income','trending-up'],['expense','Expenses','receipt'],['pocket','Withdrawals','hand-coins'],['nadra','NADRA','landmark'],['reports','Reports','bar-chart-3']];
const TL = { income:['Income','text-emerald-600 dark:text-emerald-400','trending-up'], expense:['Expense','text-rose-600 dark:text-rose-400','receipt'], pocket:['Withdrawal','text-amber-600 dark:text-amber-400','hand-coins'], topup:['Recharge','text-zinc-700 dark:text-zinc-300','landmark'] };
const I = 'w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-red-500';
const CARD = 'rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4';
const BTN = 'inline-flex items-center justify-center gap-2 rounded-lg px-3 py-2 text-sm font-medium whitespace-nowrap';
const GHOST = BTN + ' border border-slate-300 dark:border-slate-700';
const fmt = n => 'Rs ' + Math.round(Number(n)||0).toLocaleString('en-PK');
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const localDate = (d=new Date()) => new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const addDays = (s,n) => { const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return localDate(d); };

let data = []; // loaded from Supabase after sign-in
let S = { tab:'dash', date:localDate(), cat:INC_CATS[0], ntype:'bill', preset:'month', month:localDate().slice(0,7), from:'', to:'', rtype:'summary' };

const inc = e => e.type==='income' ? e.amt - (e.bill||0) : 0;
const fromNadra = e => e.type==='income' && (e.wallet ? e.wallet==='nadra' : e.cat===NAD);
const sum = (arr, f) => arr.reduce((a,e)=>a+f(e),0);
const totals = arr => {
  const incs = arr.filter(e=>e.type==='income'), income = sum(incs, inc), gross = sum(incs, e=>e.amt);
  const exp = sum(arr.filter(e=>e.type==='expense'), e=>e.amt), pocket = sum(arr.filter(e=>e.type==='pocket'), e=>e.amt), topup = sum(arr.filter(e=>e.type==='topup'), e=>e.amt);
  const nadraBills = sum(incs.filter(fromNadra), e=>e.bill||0), ownBills = sum(incs.filter(e=>!fromNadra(e)), e=>e.bill||0);
  return { income, gross, exp, pocket, topup, nadraBills, profit: income-exp, net: income-exp-pocket, cash: gross-ownBills-exp-pocket-topup };
};
const nadraBal = () => { const t = totals(data); return t.topup - t.nadraBills; };
const agg = (arr, key) => { const m = {}; arr.forEach(e => { const o = m[key(e)] = m[key(e)]||{n:0,c:0,b:0}; o.n++; o.c += e.amt; o.b += e.bill||0; }); return Object.entries(m).sort((a,b)=>b[1].c-a[1].c); };

const monthRange = ym => { const [y,m] = ym.split('-').map(Number); return [ym+'-01', ym+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0')]; };
const PERIODS = [['today','Today'],['yesterday','Yesterday'],['7','Last 7 days'],['month','This month'],['last','Last month'],['pick','Select a month…'],['all','All time'],['custom','Custom range']];
function range() {
  const t = localDate(), p = S.preset;
  if (p==='today') return [t,t]; if (p==='yesterday') return [addDays(t,-1),addDays(t,-1)]; if (p==='7') return [addDays(t,-6),t];
  if (p==='month') return monthRange(t.slice(0,7));
  if (p==='last') { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return monthRange(localDate(d).slice(0,7)); }
  if (p==='pick') return monthRange(S.month || t.slice(0,7));
  if (p==='all') return ['0000-01-01','9999-12-31'];
  return [S.from || '0000-01-01', S.to || '9999-12-31'];
}
const prevRange = (f, to) => { if (f.startsWith('0000') || to.startsWith('9999')) return null;
  if (f.endsWith('-01') && monthRange(f.slice(0,7))[1]===to) { const [y,m] = f.slice(0,7).split('-').map(Number); return monthRange(localDate(new Date(y,m-2,1)).slice(0,7)); }
  const n = Math.round((new Date(to)-new Date(f))/864e5)+1; return [addDays(f,-n), addDays(f,-1)]; };
const inR = (f, to) => data.filter(e=>e.date>=f && e.date<=to).sort((a,b)=>a.date<b.date?-1:1);
const plabel = (f, to) => f.startsWith('0000') && to.startsWith('9999') ? 'All time' : (f.endsWith('-01') && monthRange(f.slice(0,7))[1]===to) ? new Date(f+'T00:00:00').toLocaleString('en',{month:'long',year:'numeric'}) : f===to ? f : (f.startsWith('0000')?'Start':f)+' → '+(to.startsWith('9999')?'today':to);

/* ---------- UI helpers ---------- */
const kpi = (label, val, icon, color, sub='') => `<div class="${CARD}"><div class="flex items-center justify-between text-xs text-slate-500">${label}<i data-lucide="${icon}" class="h-4 w-4 ${color}"></i></div><div class="mt-1 text-xl font-bold ${color}">${fmt(val)}</div>${sub?`<div class="text-xs text-slate-500 mt-0.5">${sub}</div>`:''}</div>`;
const dl = (a,b) => !b ? '' : `${a>=b?'▲':'▼'} ${Math.abs(Math.round((a-b)/Math.abs(b)*100))}% vs previous`;
const kpiRow = (t, pt) => `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${kpi('Total income',t.income,'trending-up','text-emerald-600 dark:text-emerald-400',pt?dl(t.income,pt.income):'')}${kpi('Total expenses',t.exp,'receipt','text-rose-600 dark:text-rose-400',pt?dl(t.exp,pt.exp):'')}${kpi('Net profit',t.profit,'percent',t.profit>=0?'text-red-600':'text-rose-600',t.income?Math.round(t.profit/t.income*100)+'% margin':'')}${kpi('Balance after withdrawals',t.net,'scale','','Withdrawals '+fmt(t.pocket))}</div>`;
const section = (title, icon, body, cls='') => `<div class="${CARD} ${cls}"><h3 class="flex items-center gap-2 font-semibold mb-3 text-sm"><i data-lucide="${icon}" class="h-4 w-4 text-red-600"></i>${title}</h3>${body}</div>`;
const lines = (rs, bold) => `<div class="divide-y divide-slate-100 dark:divide-slate-800 text-sm">${rs.map(([k,v],i)=>`<div class="flex justify-between py-2 ${bold===i?'font-bold text-base':''}"><span>${k}</span><span>${v}</span></div>`).join('')}</div>`;
const tbl = (h, r, L=1, p=false) => !r.length ? '<p class="text-sm text-slate-500">No data</p>' : `<div class="overflow-x-auto"><table class="w-full ${p?'text-[11px] mb-5':'text-sm'}"><thead class="${p?'bg-black text-white':'text-xs text-slate-500'}"><tr>${h.map((x,i)=>`<th class="${p?'px-2 py-1.5':'py-1 pr-3'} ${i>=L?'text-right':'text-left'}">${x}</th>`).join('')}</tr></thead><tbody>${r.map(c=>`<tr class="break-inside-avoid ${p?'':'border-t border-slate-100 dark:border-slate-800'}">${c.map((x,i)=>`<td class="${p?'px-2 py-1.5 border-b border-zinc-200':'py-2 pr-3'} ${i>=L?'text-right':''}">${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const seg = (items, cur, fn) => `<div class="inline-flex flex-wrap gap-1 rounded-xl bg-slate-100 dark:bg-slate-800 p-1">${items.map(([k,l])=>`<button onclick="${fn}('${k}')" class="rounded-lg px-3 py-1.5 text-sm font-medium ${cur===k?'bg-white dark:bg-slate-700 text-red-600 shadow-sm':'text-slate-600 dark:text-slate-400'}">${l}</button>`).join('')}</div>`;
const setP = v => { S.preset = v; renderMain(); }, setR = v => { S.rtype = v; renderMain(); }, setN = v => { S.ntype = v; renderMain(); };
const goTab = t => { S.tab = t; renderMain(); window.scrollTo(0,0); };

function dateBar(title, icon, right='') {
  return `<div class="${CARD} flex flex-wrap items-center gap-3"><div class="flex items-center gap-2 font-semibold"><i data-lucide="${icon}" class="h-5 w-5 text-red-600"></i>${title}</div>
  <div class="flex items-center gap-2 ml-auto"><input type="date" value="${S.date}" onchange="S.date=this.value;renderMain()" class="${I} !w-auto"><button onclick="S.date=localDate();renderMain()" class="${GHOST}">Today</button>${right}</div></div>`;
}
function entryTable(list, showDate) {
  if (!list.length) return '<p class="text-sm text-slate-500">No entries yet.</p>';
  return `<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="text-xs text-slate-500 text-left"><tr>${showDate?'<th class="py-1 pr-3">Date</th>':''}<th class="pr-3">Type</th><th class="pr-3">Details</th><th class="pr-3 text-right">Amount</th><th class="pr-3 text-right">Net effect</th><th></th></tr></thead><tbody>
  ${list.slice().reverse().map(e=>{ const [l,c,ic] = TL[e.type]; const eff = e.type==='income'?inc(e): e.type==='topup'?0:-e.amt;
   return `<tr class="border-t border-slate-100 dark:border-slate-800">${showDate?`<td class="py-2 pr-3 whitespace-nowrap">${e.date}</td>`:''}<td class="py-2 pr-3 ${c} whitespace-nowrap"><i data-lucide="${ic}" class="inline h-4 w-4"></i> ${l}</td>
   <td class="pr-3">${esc(e.cat)}${e.svc?' · '+esc(e.svc):''}${e.type==='income'&&e.bill?` <span class="text-xs text-slate-500">(bill ${fmt(e.bill)})</span>`:''}${e.note?`<div class="text-xs text-slate-500">${esc(e.note)}</div>`:''}</td>
   <td class="pr-3 text-right">${fmt(e.amt)}</td><td class="pr-3 text-right font-semibold ${eff>=0?'text-emerald-600 dark:text-emerald-400':'text-rose-600 dark:text-rose-400'}">${e.type==='topup'?'–':fmt(eff)}</td>
   <td><button onclick="del('${e.id}')" class="p-1 text-slate-400 hover:text-red-600"><i data-lucide="trash-2" class="h-4 w-4"></i></button></td></tr>`; }).join('')}</tbody></table></div>`;
}
const nadraBox = () => `<div class="${CARD} flex items-center justify-between"><div class="flex items-center gap-3"><i data-lucide="landmark" class="h-5 w-5 text-red-600"></i><div><div class="text-xs text-slate-500">NADRA / E-Sahulat balance</div><div class="text-xl font-bold ${nadraBal()<0?'text-rose-600':''}">${fmt(nadraBal())}</div></div></div><span class="text-xs text-slate-500 text-right">Recharges − bills paid</span></div>`;

const drawerCash = (upTo = S.date) => totals(data.filter(e=>e.date<=upTo)).cash;
const rechargeBox = () => { const c = Math.round(drawerCash()); return `<div class="${CARD} flex flex-wrap items-center justify-between gap-3"><div><div class="text-xs text-slate-500">Cash in drawer (all collected, up to ${S.date})</div><div class="text-xl font-bold ${c<0?'text-rose-600':''}">${fmt(c)}</div><div class="text-xs text-slate-500 mt-0.5">Recharging moves this cash into the E-Sahulat balance. Income does not change.</div></div>${c>0?`<button type="button" onclick="document.getElementById('f').elements.amt.value=${c}" class="${GHOST}">Use full drawer cash</button>`:''}</div>`; };

/* ---------- Forms ---------- */
const lbl = (t, inner, cls='') => `<label class="text-xs text-slate-500 ${cls}">${t}${inner}</label>`;
const num = (n, req) => `<input name="${n}" type="number" min="0" step="any" ${req?'required':''} class="${I}" placeholder="0">`;
const opts = a => a.map(x=>`<option>${x}</option>`).join('');
function formBody() {
  const T = S.tab;
  if (T==='income') { const pay = S.cat==='Payments'; return `
    ${lbl('Category',`<select name="cat" class="${I}" onchange="S.cat=this.value;renderMain()">${INC_CATS.map(c=>`<option ${c===S.cat?'selected':''}>${c}</option>`).join('')}</select>`)}
    ${lbl('Service',`<select name="svc" class="${I}">${opts(CATS[S.cat])}</select>`)}
    ${pay?lbl('Actual bill paid (Rs)',num('bill')):''}${lbl(pay?'Collected from customer (Rs)':'Amount (Rs)',num('amt',1))}
    ${pay?lbl('Bill paid from',`<select name="wallet" class="${I}"><option value="nadra">NADRA / E-Sahulat balance</option><option value="cash">Own cash / other wallet</option></select>`)+`<p class="text-xs text-emerald-600 dark:text-emerald-400 self-end pb-2">Service charge: <b id="chg">Rs 0</b></p>`:''}`; }
  if (T==='expense') return lbl('Expense type',`<select name="cat" class="${I}">${opts(EXP)}</select>`)+lbl('Amount (Rs)',num('amt',1));
  if (T==='pocket') return lbl('Taken by',`<select name="cat" class="${I}">${opts(PEOPLE)}</select>`)+lbl('Purpose',`<input name="svc" class="${I}" placeholder="e.g. lunch, fuel">`)+lbl('Amount (Rs)',num('amt',1));
  return S.ntype==='bill'
    ? lbl('Service',`<select name="svc" class="${I}">${opts(CATS[NAD])}</select>`)+lbl('Bill amount paid (Rs)',num('bill',1))+lbl('Collected from customer (Rs)',num('amt',1))+`<p class="text-xs text-emerald-600 dark:text-emerald-400 self-end pb-2">Service charge: <b id="chg">Rs 0</b></p>`
    : lbl('Cash taken from drawer &amp; recharged to E-Sahulat (Rs)',num('amt',1));
}
const formCard = btn => `<form id="f" class="${CARD} grid sm:grid-cols-2 lg:grid-cols-4 gap-3 items-end" onsubmit="return add(event)">${formBody()}${lbl('Note (optional)',`<input name="note" class="${I}">`,'sm:col-span-2')}<button class="${BTN} bg-red-600 text-white"><i data-lucide="plus" class="h-4 w-4"></i>${btn}</button></form>`;

async function add(ev) {
  ev.preventDefault(); const fd = Object.fromEntries(new FormData(ev.target)), amt = +fd.amt; if (!(amt>0)) return false;
  const e = { date:S.date, amt, bill:0, note:fd.note||'', cat:fd.cat||'', svc:fd.svc||'' }, T = S.tab;
  if (T==='income') { e.type = 'income'; if (fd.cat==='Payments') { e.bill = +fd.bill||0; e.wallet = fd.wallet; } }
  else if (T==='nadra') { if (S.ntype==='bill') { Object.assign(e,{type:'income',cat:NAD,bill:+fd.bill||0,wallet:'nadra'}); } else Object.assign(e,{type:'topup',cat:'NADRA Recharge'}); }
  else e.type = T;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(e.date)) { alert('Please pick a valid date.'); return false; }
  const btn = ev.target.querySelector('button'); if (btn) btn.disabled = true;
  const r = await sb.from(TABLE).insert([toRow(e)]).select();
  if (r.error) { if (btn) btn.disabled = false; alert('Could not save the entry: ' + r.error.message); return false; }
  r.data.forEach(x => data.push(toEntry(x))); renderMain(); return false;
}
async function del(id) {
  if (!confirm('Delete this entry?')) return;
  const r = await sb.from(TABLE).delete().eq('id', id).select('id');
  if (r.error || !r.data || !r.data.length) { alert('Could not delete the entry' + (r.error ? ': ' + r.error.message : '.')); return; }
  data = data.filter(e => e.id !== id); renderMain();
}

/* ---------- Reports ---------- */
function build(list, type, prev) {
  const t = totals(list), incs = list.filter(e=>e.type==='income'), ex = list.filter(e=>e.type==='expense'), pk = list.filter(e=>e.type==='pocket');
  const withTotal = (rows, cols) => rows.length ? rows.concat([['<b>Total</b>', ...cols.map(c=>'<b>'+c+'</b>')]]) : rows;
  const incRows = key => agg(incs,key).map(([k,o])=>[esc(k),o.n,fmt(o.c),fmt(o.b),fmt(o.c-o.b)]);
  const incTot = [incs.length, fmt(t.gross), fmt(t.gross-t.income), fmt(t.income)];
  const byCat = ['Income by category',['Category','Entries','Collected','Bills paid','Income'],withTotal(incRows(e=>e.cat),incTot),1,true];
  const bySvc = ['Income by service',['Service','Entries','Collected','Bills paid','Income'],withTotal(incRows(e=>e.svc||e.cat),incTot),1,true];
  const simple = (title, arr, key, col) => { const g = agg(arr,key); return [title,[col,'Entries','Amount'],withTotal(g.map(([k,o])=>[esc(k),o.n,fmt(o.c)]),[arr.length,fmt(sum(arr,e=>e.amt))]),1,false]; };
  const closing = ['Closing &amp; cash',['Item','Amount'],[['Income (collected − bills paid)',fmt(t.income)],['− Expenses',fmt(t.exp)],['− Withdrawals',fmt(t.pocket)],['<b>Closing balance</b>','<b>'+fmt(t.net)+'</b>'],['Cash expected in drawer',fmt(t.cash)]],1,false];
  const nad = ['NADRA / E-Sahulat',['Item','Amount'],[['Cash recharged to balance',fmt(t.topup)],['Bills paid from balance',fmt(t.nadraBills)],['Service charge earned',fmt(sum(incs.filter(e=>e.cat===NAD),inc))],['<b>E-Sahulat balance now (all time)</b>','<b>'+fmt(nadraBal())+'</b>'],['Cash in drawer now (all time)',fmt(totals(data).cash)],['<b>Actual total (drawer + E-Sahulat)</b>','<b>'+fmt(totals(data).cash+nadraBal())+'</b>']],1,false];
  const ni = incs.filter(e=>e.cat===NAD);
  const nadSvc = ['NADRA services',['Service','Entries','Collected','Bills paid','Income'],withTotal(agg(ni,e=>e.svc).map(([k,o])=>[esc(k),o.n,fmt(o.c),fmt(o.b),fmt(o.c-o.b)]),[ni.length,fmt(sum(ni,e=>e.amt)),fmt(sum(ni,e=>e.bill||0)),fmt(sum(ni,inc))]),1,true];
  const dates = [...new Set(list.map(e=>e.date))].sort();
  const daily = ['Day-by-day',['Date','Collected','Income','Expenses','Withdrawals','Closing'],dates.map(d=>{ const x = totals(list.filter(e=>e.date===d)); return [d,fmt(x.gross),fmt(x.income),fmt(x.exp),fmt(x.pocket),fmt(x.net)]; }).concat(dates.length?[['<b>Total</b>',...[t.gross,t.income,t.exp,t.pocket,t.net].map(v=>'<b>'+fmt(v)+'</b>')]]:[]),1,true];
  const all = ['All entries',['Date','Type','Details','Amount','Net effect'],list.map(e=>[e.date,TL[e.type][0],esc(e.cat+(e.svc?' · '+e.svc:'')+(e.note?' — '+e.note:'')),fmt(e.amt),e.type==='income'?fmt(inc(e)):e.type==='topup'?'–':fmt(-e.amt)]),3,true];
  const hd = x => ['<b class="text-xs uppercase tracking-wide text-red-600">'+x+'</b>',''];
  const pl = ['Profit &amp; loss statement',['Item','Amount'],[hd('Income'),...agg(incs,e=>e.cat).map(([k,o])=>[esc(k),fmt(o.c-o.b)]),['<b>Total income</b>','<b>'+fmt(t.income)+'</b>'],hd('Expenses'),...agg(ex,e=>e.cat).map(([k,o])=>[esc(k),fmt(o.c)]),['<b>Total expenses</b>','<b>'+fmt(t.exp)+'</b>'],['<b>NET PROFIT</b>','<b>'+fmt(t.profit)+'</b>'],['Less: withdrawals',fmt(t.pocket)],['<b>Balance after withdrawals</b>','<b>'+fmt(t.net)+'</b>']],1,false];
  const days = [...new Set(incs.map(e=>e.date))], perDay = days.map(d=>[d,sum(incs.filter(e=>e.date===d),inc)]).sort((a,b)=>b[1]-a[1]), pt = prev ? totals(prev) : null;
  const chg = (a,b) => !pt || !b ? '–' : (a>=b?'▲ ':'▼ ')+Math.abs(Math.round((a-b)/Math.abs(b)*100))+'%';
  const key = ['Key figures',['Measure','Value'],[['Profit margin',t.income?Math.round(t.profit/t.income*100)+'%':'–'],['Working days',days.length],['Average daily income',fmt(days.length?t.income/days.length:0)],['Best day',perDay.length?perDay[0][0]+' ('+fmt(perDay[0][1])+')':'–'],['Income entries',incs.length],['Average per entry',fmt(incs.length?t.income/incs.length:0)],['Income vs previous period',chg(t.income,pt&&pt.income)],['Expenses vs previous period',chg(t.exp,pt&&pt.exp)],['Profit vs previous period',chg(t.profit,pt&&pt.profit)]],1,false];
  const share = (title, col, g, T) => [title,[col,'Entries','Amount','Share'],withTotal(g.map(([k,v,n])=>[esc(k),n,fmt(v),Math.round(v/(T||1)*100)+'%']),[g.reduce((a,x)=>a+x[2],0),fmt(T),T?'100%':'–']),1,false];
  const catShare = share('Income by category','Category',agg(incs,e=>e.cat).map(([k,o])=>[k,o.c-o.b,o.n]),t.income);
  const expShare = share('Expenses by type','Type',agg(ex,e=>e.cat).map(([k,o])=>[k,o.c,o.n]),t.exp);
  const topSvc = ['Top 5 services',['Service','Entries','Income'],agg(incs,e=>e.svc||e.cat).map(([k,o])=>[esc(k),o.n,o.c-o.b]).sort((a,b)=>b[2]-a[2]).slice(0,5).map(r=>[r[0],r[1],fmt(r[2])]),1,false];
  const secs = { summary:[pl,key,catShare,expShare,topSvc,simple('Withdrawals by person',pk,e=>e.cat,'Person'),nad,closing],
    income:[byCat,bySvc], expense:[simple('Expenses by type',ex,e=>e.cat,'Type')], pocket:[simple('Withdrawals by person',pk,e=>e.cat,'Person'),simple('Withdrawals by purpose',pk,e=>e.svc||'Unspecified','Purpose')],
    nadra:[nad,nadSvc],
    daily:[daily], all:[all] };
  return { t, secs: secs[type].filter(Boolean) };
}
const RTYPES = [['summary','Monthly Summary'],['income','Income'],['expense','Expenses'],['pocket','Withdrawals'],['nadra','NADRA'],['daily','Day-by-day'],['all','All entries']];
const rname = () => RTYPES.find(x=>x[0]===S.rtype)[1];

function printReport(f, to, type) {
  const list = inR(f,to), pr = prevRange(f,to), { t, secs } = build(list, type, pr ? inR(pr[0],pr[1]) : null), rn = RTYPES.find(x=>x[0]===type)[1];
  const w = window.open('', '_blank'); if (!w) { alert('Please allow pop-ups to open the report.'); return; }

function csv(list) {
  const r = [['Date','Type','Category','Detail','Amount','Bill Paid','Income','Note']].concat(list.map(e=>[e.date,e.type,e.cat,e.svc,e.amt,e.bill||0,inc(e),e.note]));
  const b = new Blob([r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'shop-report.csv'; a.click();
}

  document.getElementById('tabs').innerHTML = TABS.map(([k,l,ic])=>`<button onclick="goTab('${k}')" class="${BTN} ${T===k?'bg-red-600 text-white':'text-slate-600 dark:text-slate-300'}"><i data-lucide="${ic}" class="h-4 w-4"></i><span class="hidden sm:inline">${l}</span></button>`).join('');

      ${section('Money position (all time, up to '+S.date+')','wallet',lines([['Cash in drawer',fmt(pos.cash)],['E-Sahulat balance',fmt(posNb)],['= Actual total (drawer + E-Sahulat)',fmt(pos.cash+posNb)]],2)+'<p class="text-xs text-slate-500 mt-2">Deposits to E-Sahulat only move money between drawer and balance. The total grows only with new income, less expenses and withdrawals.</p>')}
      <div class="grid lg:grid-cols-2 gap-4">${section('Closing formula','calculator',lines([['Income (collected − bills paid)',fmt(t.income)],['− Expenses',fmt(t.exp)],['− Withdrawals',fmt(t.pocket)],['= Closing balance',fmt(t.net)]],3))}
      ${section('Cash in drawer','banknote',lines([['Opening cash (carried over)',fmt(opening)],['+ Total collected today',fmt(t.gross)],['− Bills paid from own cash',fmt(t.gross-t.income-t.nadraBills)],['− Expenses &amp; withdrawals',fmt(t.exp+t.pocket)],['− Recharged to E-Sahulat',fmt(t.topup)],['= Expected cash in drawer',fmt(opening+t.cash)]],5))}
      ${section('Income by category','pie-chart',tbl(['Category','Income'],g.map(([k,o])=>[esc(k),fmt(o.c-o.b)])))}
      <div class="space-y-4">${nadraBox()}<div class="${CARD}"><div class="text-xs text-slate-500 mb-2">Quick add</div><div class="flex flex-wrap gap-2">${TABS.slice(1,5).map(([k,l,ic])=>`<button onclick="goTab('${k}')" class="${GHOST}"><i data-lucide="${ic}" class="h-4 w-4"></i>${l}</button>`).join('')}</div></div></div></div>`;
  } else if (T==='reports') {
    const [f,to] = range(), list = inR(f,to), pr = prevRange(f,to), prev = pr ? inR(pr[0],pr[1]) : null, { t, secs } = build(list, S.rtype, prev);
    const sel = (l, on, items, cur) => `<label class="text-xs font-medium text-slate-500">${l}<select onchange="${on}" class="${I} mt-1 text-slate-900 dark:text-slate-100">${items.map(([k,n])=>`<option value="${k}" ${cur===k?'selected':''}>${n}</option>`).join('')}</select></label>`;
    const dt = (l,id,v) => `<label class="text-xs font-medium text-slate-500">${l}<input type="date" value="${v}" onchange="S.${id}=this.value;renderMain()" class="${I} mt-1"></label>`;
    m.innerHTML = `<div class="${CARD}"><div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 items-end">
      ${sel('Period',"S.preset=this.value;renderMain()",PERIODS,S.preset)}${sel('Report type',"S.rtype=this.value;renderMain()",RTYPES,S.rtype)}
      ${S.preset==='pick'?`<label class="text-xs font-medium text-slate-500">Month<input type="month" value="${S.month}" onchange="S.month=this.value;renderMain()" class="${I} mt-1"></label>`:''}
      ${S.preset==='custom'?dt('From','from',S.from)+dt('To','to',S.to):''}
      <div class="flex gap-2 sm:col-span-2 lg:col-span-1 lg:ml-auto"><button onclick="csv(inR('${f}','${to}'))" class="${GHOST}"><i data-lucide="download" class="h-4 w-4"></i>CSV</button><button onclick="printReport('${f}','${to}','${S.rtype}')" class="${BTN} bg-red-600 text-white"><i data-lucide="printer" class="h-4 w-4"></i>Print A4</button></div></div></div>
      <div class="${CARD} flex flex-wrap items-center justify-between gap-2 !border-l-4 !border-l-red-600"><div><div class="text-xs text-slate-500">${rname()}</div><div class="text-lg font-bold">${plabel(f,to)}</div></div><div class="text-xs text-slate-500">${list.length} entries in this period</div></div>
      ${S.rtype==='summary'||S.rtype==='daily'?kpiRow(t, prev?totals(prev):null):''}
      <div class="grid lg:grid-cols-2 gap-4">${secs.map(([ti,h,r,L,wide])=>section(ti,'table-2',tbl(h,r,L),wide?'lg:col-span-2':'')).join('')}</div>`;
  } else {
    const own = T==='income' ? day.filter(e=>e.type==='income' && e.cat!==NAD) : T==='nadra' ? day.filter(e=>e.type==='topup' || e.cat===NAD) : day.filter(e=>e.type===T);
    const x = totals(own), titles = { income:['Income','trending-up','Add Income'], expense:['Expenses','receipt','Add Expense'], pocket:['Withdrawals','hand-coins','Add Withdrawal'], nadra:['NADRA / E-Sahulat','landmark',S.ntype==='bill'?'Add Bill Payment':'Add Recharge'] }[T];
    const totalTxt = T==='income' ? ['Income',x.income] : T==='nadra' ? ['Service charge',sum(own.filter(e=>e.type==='income'),inc)] : ['Total',sum(own,e=>e.amt)];
    m.innerHTML = dateBar(titles[0],titles[1],`<span class="text-sm text-slate-500 pl-2">${totalTxt[0]}: <b class="text-slate-900 dark:text-white">${fmt(totalTxt[1])}</b></span>`) +
      (T==='nadra' ? nadraBox() + `<div class="flex">${seg([['bill','Bill payment'],['recharge','Recharge balance']],S.ntype,'setN')}</div>` + (S.ntype==='recharge' ? rechargeBox() : '') : '') +
      formCard(titles[2]) + section(`${titles[0]} on ${S.date}`,'list',entryTable(own,false));
    const fm = document.getElementById('f'), c = document.getElementById('chg');
    if (c) fm.addEventListener('input', () => c.textContent = fmt((+fm.elements.amt.value||0)-(+fm.elements.bill.value||0)));
  }
  lucide.createIcons();
}
/* ================= Supabase backend ================= */
const CFG = window.BC_CONFIG || {};
const TABLE = 'entries';
const TYPES = ['income','expense','pocket','topup'];
const configured = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && !/YOUR_/.test(CFG.SUPABASE_URL + CFG.SUPABASE_ANON_KEY));
const sb = (configured && window.supabase) ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;

// DB row <-> the same entry shape the app always used
const toEntry = r => { const e = { id:r.id, date:r.date, type:r.type, cat:r.cat||'', svc:r.svc||'', amt:Number(r.amt)||0, bill:Number(r.bill)||0, note:r.note||'' }; if (r.wallet) e.wallet = r.wallet; return e; };
const toRow = e => ({ date:e.date, type:e.type, cat:e.cat||'', svc:e.svc||'', amt:e.amt, bill:e.bill||0, wallet:e.wallet||null, note:e.note||'' });

// Supabase returns max 1000 rows per request, so page through everything
async function fetchAll() {
  const out = [], step = 1000;
  for (let from = 0; ; from += step) {
    const r = await sb.from(TABLE).select('*').order('date').order('created_at').order('id').range(from, from + step - 1);
    if (r.error) throw r.error;
    out.push(...r.data);
    if (r.data.length < step) break;
  }
  return out.map(toEntry);
}
async function sync(force) {
  const fresh = await fetchAll();
  if (force || JSON.stringify(fresh) !== JSON.stringify(data)) { data = fresh; renderMain(); }
}

/* ---------- notices / user bar ---------- */
const notice = html => { document.getElementById('notice').innerHTML = html || ''; lucide.createIcons(); };
const IBTN = GHOST + ' !px-2.5';
function renderUserBar(email) {
  document.getElementById('userbar').innerHTML = `<span class="hidden md:inline text-xs text-slate-500 mr-1">${esc(email)}</span>
    <button title="Refresh" onclick="refresh()" class="${IBTN}"><i data-lucide="refresh-cw" class="h-4 w-4"></i></button>
    <button title="Download backup (JSON)" onclick="backup()" class="${IBTN}"><i data-lucide="download" class="h-4 w-4"></i></button>
    <button title="Import entries (JSON)" onclick="document.getElementById('imp').click()" class="${IBTN}"><i data-lucide="upload" class="h-4 w-4"></i></button>
    <input id="imp" type="file" accept=".json,application/json" class="hidden" onchange="importFile(this)">
    <button title="Sign out" onclick="signOut()" class="${IBTN}"><i data-lucide="log-out" class="h-4 w-4"></i></button>`;
  lucide.createIcons();
}

/* ---------- login ---------- */
function showLogin() {
  S.user = null; data = [];
  document.getElementById('tabs').innerHTML = ''; document.getElementById('userbar').innerHTML = ''; notice('');
  document.getElementById('main').innerHTML = `<form class="${CARD} max-w-sm mx-auto mt-10 space-y-3" onsubmit="return login(event)">
    <div class="flex items-center gap-2 font-semibold"><i data-lucide="lock" class="h-5 w-5 text-red-600"></i>Sign in</div>
    ${lbl('Email',`<input name="email" type="email" required autocomplete="username" class="${I} mt-1">`,'block')}
    ${lbl('Password',`<input name="password" type="password" required autocomplete="current-password" class="${I} mt-1">`,'block')}
    <p id="lerr" class="text-xs text-rose-600 min-h-4"></p>
    <button class="${BTN} bg-red-600 text-white w-full">Sign in</button></form>`;
  lucide.createIcons();
}
async function login(ev) {
  ev.preventDefault();
  const f = ev.target, b = f.querySelector('button'), er = document.getElementById('lerr');
  b.disabled = true; er.textContent = '';
  const r = await sb.auth.signInWithPassword({ email: f.elements.email.value.trim(), password: f.elements.password.value });
  if (r.error) { er.textContent = r.error.message; b.disabled = false; return false; }
  await start(r.data.session.user); return false;
}
async function signOut() { await sb.auth.signOut(); showLogin(); }

/* ---------- start / refresh ---------- */
async function start(user) {
  const m = document.getElementById('main');
  m.innerHTML = '<p class="text-sm text-slate-500 p-10 text-center">Loading…</p>';
  try { data = await fetchAll(); }
  catch (err) {
    m.innerHTML = `<div class="${CARD} max-w-md mx-auto mt-10 space-y-3"><div class="font-semibold text-rose-600">Could not load data</div><p class="text-sm text-slate-500">${esc(err.message || err)}</p><div class="flex gap-2"><button onclick="boot()" class="${BTN} bg-red-600 text-white">Retry</button><button onclick="signOut()" class="${GHOST}">Sign out</button></div></div>`;
    return;
  }
  S.user = user.email; renderUserBar(user.email); checkLocal(); renderMain();
}
async function refresh() { try { await sync(true); } catch (err) { alert('Could not refresh: ' + (err.message || err)); } }
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user) sync(false).catch(() => {}); });

/* ---------- backup / import ---------- */
function backup() {
  const b = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'bc-backup-' + localDate() + '.json'; a.click();
}
const validEntry = e => e && TYPES.includes(e.type) && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && +e.amt > 0;
async function doImport(list) {
  const have = new Set(data.map(e => String(e.id))), before = data.length;
  const ok = list.filter(validEntry).filter(e => !have.has(String(e.id)));
  const base = Date.now() - ok.length; // keeps original order for same-day entries
  const rows = ok.map((e, i) => ({ ...toRow({ ...e, amt:+e.amt, bill:+e.bill||0 }), legacy_id: e.id != null ? String(e.id) : null, created_at: new Date(base + i).toISOString() }));
  for (let i = 0; i < rows.length; i += 500) {
    const r = await sb.from(TABLE).upsert(rows.slice(i, i + 500), { onConflict: 'legacy_id', ignoreDuplicates: true });
    if (r.error) throw r.error;
  }
  data = await fetchAll(); renderMain();
  return { added: data.length - before, total: list.length };
}
async function importFile(inp) {
  const file = inp.files[0]; inp.value = ''; if (!file) return;
  try {
    const list = JSON.parse(await file.text());
    if (!Array.isArray(list)) throw new Error('File must contain a list of entries.');
    if (!confirm('Import ' + list.length + ' entries from this file? Entries already in the system are skipped.')) return;
    const r = await doImport(list);
    alert('Imported ' + r.added + ' new entries (' + (r.total - r.added) + ' skipped: duplicates or invalid).');
  } catch (err) { alert('Import failed: ' + (err.message || err)); }
}
// One-time helper: finds data saved by the old (localStorage) version in this same browser
function checkLocal() {
  let list = []; try { list = JSON.parse(localStorage.getItem('bc_entries') || '[]'); } catch (e) {}
  if (!Array.isArray(list) || !list.length || localStorage.getItem('bc_imported') === '1') { notice(''); return; }
  window._local = list;
  notice(`<div class="${CARD} !border-amber-400 flex flex-wrap items-center gap-3"><i data-lucide="database" class="h-5 w-5 text-amber-600"></i>
    <div class="text-sm flex-1">Found <b>${list.length}</b> entries saved in this browser by the old version. Move them to the cloud database?</div>
    <button onclick="importLocal()" class="${BTN} bg-red-600 text-white">Import now</button>
    <button onclick="localStorage.setItem('bc_imported','1');notice('')" class="${GHOST}">Dismiss</button></div>`);
}
async function importLocal() {
  try {
    const r = await doImport(window._local);
    localStorage.setItem('bc_imported', '1'); notice('');
    alert('Imported ' + r.added + ' entries. Your old browser copy was left untouched as a backup.');
  } catch (err) { alert('Import failed: ' + (err.message || err)); }
}

/* ---------- boot ---------- */
async function boot() {
  const m = document.getElementById('main');
  if (!sb) {
    m.innerHTML = `<div class="${CARD} max-w-md mx-auto mt-10 space-y-2"><div class="font-semibold text-rose-600">Setup needed</div><p class="text-sm text-slate-500">Open <b>config.js</b> and paste your Supabase Project URL and anon key (see README), or the Supabase library failed to load.</p></div>`;
    return;
  }
  const r = await sb.auth.getSession();
  if (r.data.session) start(r.data.session.user); else showLogin();
}
if (sb) sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') setTimeout(showLogin, 0); });
boot();
