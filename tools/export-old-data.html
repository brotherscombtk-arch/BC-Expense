<!DOCTYPE html><html><head><meta charset="utf-8"><title>Export old shop data</title>
<meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="font-family:sans-serif;max-width:480px;margin:40px auto;padding:0 16px">
<h2>Export old shop data</h2>
<p>Open this file <b>in the same browser and from the same folder/location</b> where you used the old Brothers Communication file.</p>
<p id="msg"></p><button id="b" style="padding:10px 16px;font-size:16px" disabled>Download bc-old-data.json</button>
<script>
let raw=null; try{ raw=localStorage.getItem('bc_entries'); }catch(e){}
let list=[]; try{ list=JSON.parse(raw||'[]'); }catch(e){}
const msg=document.getElementById('msg'), b=document.getElementById('b');
if(Array.isArray(list)&&list.length){ msg.textContent='Found '+list.length+' entries.'; b.disabled=false;
 b.onclick=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(list)],{type:'application/json'})); a.download='bc-old-data.json'; a.click(); }; }
else msg.textContent='No old data found here. Try the same browser/location as the old file (see README, "Move your old data").';
</script></body></html>
