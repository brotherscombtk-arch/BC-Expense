[build]
  publish = "public"      # no build step – it is a static site

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
